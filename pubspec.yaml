name: godsseo
description: "godsseo app"

publish_to: 'none' 


version: 2.1.1+6

environment:
  sdk: ^3.9.2

dependencies:
 cached_network_image: ^3.3.1
 cupertino_icons: ^1.0.2
 device_info_plus: ^12.4.0
 firebase_core: ^4.6.0
 firebase_auth: ^6.3.0
 cloud_firestore: ^6.2.0
 firebase_storage: ^13.2.0
 firebase_app_check: ^0.4.2
 flutter:
    sdk: flutter
 flutter_image_compress: ^2.1.0
 flutter_launcher_icons: ^0.14.4
 flutter_svg: ^2.0.10+1
 geocoding: ^4.0.0
 geolocator: ^14.0.2
 get: ^4.7.3
 google_fonts: ^8.0.2
 image_picker: ^1.0.7
 intl: ^0.20.2
 nb_utils: ^7.1.8
 path_provider: ^2.1.2
 permission_handler: ^12.0.1
 firebase_messaging: ^16.1.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
  - assets/image/
  - assets/svg/


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/image/logo.png"
  min_sdk_android: 21