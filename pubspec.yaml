name: godsseo
description: "godsseo app"

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
 cached_network_image: ^3.3.1
 cupertino_icons: ^1.0.2
 device_info_plus: ^9.1.2
 firebase_core: ^3.6.0
 firebase_auth: ^5.3.1
 cloud_firestore: ^5.4.4
 firebase_storage: ^12.3.2
 firebase_app_check: ^0.3.1+4
 flutter:
    sdk: flutter
 flutter_image_compress: ^2.1.0
 flutter_launcher_icons: ^0.13.1
 flutter_svg: ^2.0.10+1
 geocoding: ^3.0.0
 geolocator: ^11.0.0
 get: 4.6.6
 google_fonts: 6.1.0
 image_picker: ^1.0.7
 intl: ^0.19.0
 nb_utils: ^7.1.8
 path_provider: ^2.1.2
 permission_handler: ^12.0.1

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:


  uses-material-design: true


  assets:
  - assets/image/
  - assets/svg/


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/image/logo.png"
  min_sdk_android: 21